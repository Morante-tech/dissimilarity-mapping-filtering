name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install ".[spark,legacy,test]"
      - name: Run tests
        run: pytest -v
      - name: Run the original scripts
        env:
          MPLBACKEND: Agg
        run: |
          python python/src/main_demons_selector.py
          python python/src/main_feature_selector.py
