[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dissimilarity-mapping-filtering"
description = "Unsupervised anomaly detection and demonstration selection (DMF), in NumPy and PySpark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santiago Morante" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
keywords = ["anomaly detection", "outlier detection", "dynamic time warping", "robot learning", "spark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
# dependencies of the original 2015 scripts in python/ (not needed by the package)
legacy = ["scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Morante-tech/dissimilarity-mapping-filtering"
Paper = "https://doi.org/10.1109/HUMANOIDS.2015.7363569"

[tool.setuptools.dynamic]
version = { attr = "dmf.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
